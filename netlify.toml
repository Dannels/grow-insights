# Static site: publish site/ as-is. No build step.
[build]
  publish = "site"

[[headers]]
  for = "/data/*.parquet"
  [headers.values]
    Content-Type = "application/octet-stream"
    Cache-Control = "public, max-age=31536000, immutable"   # files are versioned by ?v=<data hash>
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/data/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
