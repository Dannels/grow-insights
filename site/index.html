<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grow Insights</title>
<meta name="description" content="Commerce analytics demo for Grow Computer — synthetic data, queried live in your browser with DuckDB-WASM.">
<link rel="icon" href="assets/brand/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&family=Inter:wght@300;400;600;700&family=Fraunces:wght@300;600&display=swap">
<link rel="stylesheet" href="assets/app.css">
<script src="assets/theme.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#/overview" id="brand"><img id="brand-logo" alt=""><b id="brand-name">Grow Computer</b><span id="brand-product">Insights</span></a>
    <span class="demo-pill" title="Every number on this site is synthetic">Demo · synthetic data</span>
    <div class="top-right">
      <span class="asof" id="asof"><i></i>Loading data…</span>
      <div class="theme-pick" id="themes" role="group" aria-label="Theme"></div>
    </div>
  </div>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
</header>
<div class="filters" id="filters"></div>
<main id="view"><div class="loading"><img src="assets/brand/orbit_6.gif" alt=""><span id="boot-msg">Starting the in-browser database…</span></div></main>
<footer>
  <span>Every company metric here is generated by a seeded simulator — no real customers, orders or financials.</span>
  <span>Built by Dan · <a href="#/about">How it's built</a></span>
</footer>
<script type="module" src="assets/app.js"></script>
